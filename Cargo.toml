[package]
name = "seraphim"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.9", features = ["derive"] }
actix-web = "4"
futures-util = "0.3.34"
actix-ws = "0.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "sqlite",
    "macros"
] }
tokio = { version = "1", features = ["full"] }
email_address = "0.2"